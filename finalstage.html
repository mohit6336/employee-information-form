<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->

    <title>Final Stage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.20.0/jquery.validate.min.js"
    integrity="sha512-WMEKGZ7L5LWgaPeJtw9MBM4i5w5OSBlSjTjCtSnvFJGSVD26gE5+Td12qN5pvWXhuWaWcVwF++F7aqu9cvqP0A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.20.0/jquery.validate.min.js"
        integrity="sha512-WMEKGZ7L5LWgaPeJtw9MBM4i5w5OSBlSjTjCtSnvFJGSVD26gE5+Td12qN5pvWXhuWaWcVwF++F7aqu9cvqP0A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.20.0/jquery.validate.min.js"
        integrity="sha512-WMEKGZ7L5LWgaPeJtw9MBM4i5w5OSBlSjTjCtSnvFJGSVD26gE5+Td12qN5pvWXhuWaWcVwF++F7aqu9cvqP0A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>
</head>

<body>
    <form action="#" id="addform" enctype="multipart/form-data">
        <form action="#" id="addform" enctype="multipart/form-data">
            <div class="container-fluid bg-light text-dark py-3">
                <header class="text-center">
                    <h1 class="display-6 fw-bolder">Questions</h1>
                </header>
                <hr />
                <div class="container mt-5">
                    <div class="row my-6">
                        <div class="col-lg-12 mx-auto">
                            <div class="card shadow">
                                <div class="card-header">
                                    <h4 class="mx-auto">Questions</h4>
                                </div>
                                <div class="card-body">
                                    <section class="container text-dark p-2">

                                        <label for="validationCustom01" class="form-label mb-3">1. Are you related to
                                            any of
                                            the present / previous employess of ?</label>
<div class="row">
                                        <div class="col-md-4">
                                            <input type="text" class="form-control mb-2 " id="validationCustom01"
                                                name="que_1.1" placeholder="If yes, Name of employee" />
                                        </div>
                                        <div class="col-md-4">

                                            <input type="text" class="form-control mb-2"
                                                id="validationCustom02"name="que_1.2" placeholder="Designation" />
                                        </div>
                                        <div class="col-md-4">

                                            <div class="input-group has-validation">
                                                <input type="text" class="form-control"
                                                    id="validationCustomUsername"name="que_1.3"
                                                    id="validationCustomUsername"name="que_1.3"
                                                    aria-describedby="inputGroupPrepend" placeholder="Relationship" />
                                            </div>
                                        </div>
                                    </div>
                                        <label for="validationCustom01" class="form-label mt-4">
                                            2. What interests you about this role ? </label>
                                        <div class="col-12">

                                            <textarea class="form-control" id="exampleFormControlTextarea1" name="que_2" rows="3"></textarea>
                                        </div>
                                        <label for="validationCustom01" class="form-label mt-4">3. How soon would you
                                            been
                                            able to join us ?</label>
                                        <div class="col-12">

                                            <textarea class="form-control" id="exampleFormControlTextarea1" name="que_3" rows="3"></textarea>
                                        </div>
                                        <label for="validationCustom01" class="form-label mt-4">4. Describe a difficult
                                            work
                                            situation or project and how you overcame it.</label>
                                        <div class="col-12">

                                            <textarea class="form-control" id="exampleFormControlTextarea1" name="que_4"rows="3"></textarea>
                                        </div>
                                        <label for="validationCustom01" class="form-label mt-4">5. Are you willing to
                                            sign a
                                            service Contract, if required ?</label>
                                        <div class="col-12">

                                            <textarea class="form-control" id="exampleFormControlTextarea1" name="que_5" rows="3"></textarea>
                                        </div>

                                        <label for="validationCustom01" class="form-label mt-4">6. What do you know
                                            about
                                            our company or us 
                                            ?</label>
                                        <div class="col-12">

                                            <textarea class="form-control" id="exampleFormControlTextarea1" name="que_6" rows="3"></textarea>
                                        </div>

                                        <label for="validationCustom01" class="form-label mt-4">7. What do you want
                                            from
                                            this job ?</label>
                                        <div class="col-12">

                                            <textarea class="form-control" id="exampleFormControlTextarea1" name="que_7" rows="3"></textarea>
                                        </div>
                                </div>
                            </div>



                        </div>
                    </div>
                </div>
                <div class="container mt-5">
                    <div class="row my-4">
                        <div class="col-lg-12 mx-auto">
                            <div class="card shadow">
                                <div class="card-header">
                                    <h4 class="mx-auto">Academic Details</h4>
                                </div>
                                <div class="card-body mt-3">
                                    <form method="post" id="add_form">
                                        <div id="show_item">
                                            <div class="row">
                                                            <div class="col-md-2 mb-3">
                                                                <input type="text" name="name[]"
                                                                
                                                                class="form-control" placeholder="Name" >
                                                                
                                                            </div>
                                                                <div class="col-md-3 mb-3">
                                                                <input type="text" name="address[]"
                                                                    class="form-control" placeholder="Address">
                                                            </div>
                                                            
                                                            <div class="col-md-2 mb-3">
                                                                <input type="text" name="occupation[]"
                                                                    class="form-control" placeholder="Occupation">
                                                            </div>
                                                           
                                                            <div class="col-md-2 mb-3">
                                                                <input type="text" name="years_known[]"
                                                                    class="form-control" placeholder="Years known">
                                                            </div>
                                                       
                                                            <div class="col-md-2 mb-3">
                                                                <input type="number" name="mobile_number[]"
                                                                    class="form-control" placeholder="Mobile number">
                                                            </div>
                                                            <div class="col-md-1 mb-3 d-grid">
                                                                <button
                                                                    class="btn btn-success add_item_btn">Add</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                  </div>
                            </div>
                                            </div>
                                       </div>
                                </div>
                                                <div class="container mt-5">
                                                    <div class="row my-6">
                                                        <div class="col-lg-12 mx-auto">
                                                            <div class="card shadow">
                                                                <div class="card-header">
                                                                    <h4 class="mx-auto">Salary</h4>
                                                                </div>
                                                                <div class="card-body">
                                                                    <section class="container text-dark p-2">
                                                                        <div class="row g-3">

                                                                                <div class="col-md-4">
                                                                                    <input type="text"
                                                                                        class="form-control"
                                                                                        id="validationCustom01"
                                                                                        name="current_salary"
                                                                                        placeholder="Current Salary"
                                                                                        required />
                                                                                </div>
                                                                                <div class="col-md-4">
                                                                                    <input type="text"
                                                                                        class="form-control"
                                                                                        id="validationCustom02"
                                                                                        name="expected_salary"
                                                                                        placeholder="Expected Salary"
                                                                                        required />
                                                                                </div>
                                                                                <div class="col-md-4">

                                                                                    <div
                                                                                        class="input-group has-validation">
                                                                                        <input type="text"
                                                                                            class="form-control"
                                                                                            id="validationCustomUsername"
                                                                                            name="notice_period"
                                                                                            placeholder="Notice Period"
                                                                                            aria-describedby="inputGroupPrepend"
                                                                                            required />
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                </div>
                                                            </div>
                                                                                    <div class="container mt-5">
                                                                                        <div class="row">
                                                                                            <div
                                                                                                class="col-lg-12 mx-auto">
                                                                                                <div
                                                                                                    class="card shadow">
                                                                                                    <div
                                                                                                        class="card-header">
                                                                                                        <h4
                                                                                                            class="mx-auto">
                                                                                                            Upload
                                                                                                            resume</h4>
                                                                                                    </div>
                                                                                                    <div
                                                                                                        class="card-body">
                                                                                                        <div
                                                                                                            id="show_item">
                                                                                                            <div
                                                                                                                class="row">
                                                                                                                <div
                                                                                                                    class="col-md-6 mb-2">
                                                                                                                    <div
                                                                                                                        class='container'>
                                                                                                                        <form
                                                                                                                            method="post"
                                                                                                                            enctype=multipart/form-data>
                                                                                                                            <div
                                                                                                                                class="input-group mt-3">
                                                                                                                                <label
                                                                                                                                    class="input-group-text">Select
                                                                                                                                    Your
                                                                                                                                    Resume
                                                                                                                                </label>
                                                                                                                                <input
                                                                                                                                    type="file"
                                                                                                                                    class="form-control"
                                                                                                                                    name="resume"
                                                                                                                                    id="resume"
                                                                                                                                    required
                                                                                                                                    accept=".doc, .pdf, .jpeg, .png">
                                                                                                                                <sup
                                                                                                                                    style="color :red">*</sup>
                                                                                                                                </div>
                                                                                                                            <div
                                                                                                                                class="row g-3">
                                                                                                                                <div
                                                                                                                                    class="col-md-6">

                                                                                                                                    <div
                                                                                                                                        class="input-group has-validation mt-4">
                                                                                                                                        <input
                                                                                                                                            type="text"
                                                                                                                                            class="form-control"
                                                                                                                                            id="datepicker"
                                                                                                                                            name="current_date"
                                                                                                                                            aria-describedby="inputGroupPrepend"
                                                                                                                                            placeholder="Current Date"
                                                                                                                                            required /> <sup
                                                                                                                                            style="color :red">*</sup>
                                                                                                                                       
                                                                                                                                    </div>
                                                                                                                                </div>
                                                                                                                                <div
                                                                                                                                    class="col-md-6 ">

                                                                                                                                    <div
                                                                                                                                        class="input-group has-validation mt-4">
                                                                                                                                        <input
                                                                                                                                            type="text"
                                                                                                                                            class="form-control"
                                                                                                                                            id="validationCustomUsername"
                                                                                                                                            name="place"
                                                                                                                                            aria-describedby="inputGroupPrepend"
                                                                                                                                            placeholder="Place"
                                                                                                                                            required /> <sup
                                                                                                                                            style="color :red">*</sup>
                                                                                                                                       
                                                                                                                      

                                                                                                                                    </div></div>
                                                                                            </div>
                                                                                            </section>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>

                                                                    </div>
                                                                    <div
                                                                        class="col-md-12 d-grid gap-1 d-md-flex justify-content-md-end mt-3">
                                                                        <button type="submit"
                                                                            class="btn btn-danger">Previous</button>
                                                                        <button type="submit"
                                                                            class="btn btn-primary">Submit</button>
                                                                    </div>
        </form>
        </div>
        <script>
     $('#datepicker').datepicker({
        
        maxDate: '0',
        minDate: '0',
        dateFormat: 'dd/mm/yy',
    });
        </script>
        <script>
            $(document).ready(function() {
                        $(".add_item_btn").click(function(e) {
                                    e.preventDefault();
                                    $("#show_item").append(` <div class="row">
                                                                        </div>
                                                                        <div class="col-md-12 d-grid gap-1 d-md-flex justify-content-md-end mt-3">
                                                                            <button type="submit" class="btn btn-danger">Previous</button>
                                                                            <button type="submit" class="btn btn-primary">Submit</button>
                                                                        </div>
                                    </form>
                                    </div>
                                    <script>
                                        $(function() {
                                            $("#datepicker").datepicker();
                                        });
        </script>
        <script>
            $(document).ready(function() {
                $(".add_item_btn").click(function(e) {
                    e.preventDefault();
                    $("#show_item").append(` <div class="row">
                              <div class="col-md-2 mb-3">
                                <input type="text" name="name[]" class="form-control" placeholder="Name" required>
                              </div>


                              <div class="col-md-3 mb-3">
                                <input type="text" name="address[]" class="form-control" placeholder="Address" required>
                              </div>

                              <div class="col-md-2 mb-3">
                                <input type="text" name="occupation[]" class="form-control" placeholder="Occupation" required>
                              </div>

                              <div class="col-md-2 mb-3">
                                <input type="text" name="years_known[]" class="form-control" placeholder="Years Known" required>
                              </div>

                              <div class="col-md-2 mb-3">
                                <input type="number" name="mobile_number[]" class="form-control" placeholder="Mobile number" required>
                              </div>
                              <div class="col-md-1 d-grid ps-2 mb-3">
                                <button class="btn btn-danger remove_item_btn">Remove</button>
                              </div>
                            </div>
`)
                });
           
        $(document).on('click', '.remove_item_btn', function(e) {
        e.preventDefault();
        let row_item = $(this).parent().parent();
        $(row_item).remove();
        });
        });
        </script>
</body>

</html>
